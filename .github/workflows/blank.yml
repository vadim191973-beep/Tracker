name: Build Hardcore APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          flutter create --project-name=transformation app
          echo "_QvtGA0YIg0Lgg0KLQtdC70L8gKDEg0KfQkNCfIC8gNjAg0JzQmNCdKScsCiAgICAgICAgc3VidGl0bGU6ICfQkdC10LMsINGB0LjQu9C-_-" | base64 -d > app/lib/main.dart
          cd app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreTransformation-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
